[project]
name = "synthese-pipeline"
version = "0.1.0"
description = "Synthetische data maken als stap in een datapipeline, met behoud van structuur"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CEDA" }]
keywords = ["synthetische data", "synthetic data", "metasyn", "privacy", "onderwijsdata", "datapipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Dutch",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deltalake>=1",
    "faker==40.63.0",
    "metasyn==3.1.0",
    "metasyn-disclosure==0.3.3",
    "polars>=1.24",
    "scipy>=1.11",
    "tomli-w==1.2.0",
]

[project.scripts]
synthese-pipeline = "synthese_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/cedanl/synthese-pipeline"
Documentation = "https://github.com/cedanl/synthese-pipeline#readme"
Repository = "https://github.com/cedanl/synthese-pipeline"
Issues = "https://github.com/cedanl/synthese-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthese_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["synthese_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]
