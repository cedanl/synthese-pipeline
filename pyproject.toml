[project]
name = "synthese-pipeline"
version = "0.1.0"
description = "Synthetische data maken als stap in een datapipeline, met behoud van structuur"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "metasyn>=3,<4",
    "polars>=1",
]

[project.scripts]
synthese-pipeline = "synthese_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/cedanl/synthese-pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthese_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["synthese_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]
