name: Publish to PyPI

# Publishes a release to PyPI with Trusted Publishing (OIDC, no API tokens).
# Runs only on a version tag vX.Y.Z; the tag must match project.version in pyproject.toml.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'EOF'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag != f"v{version}":
              print(
                  f"::error::Tag {tag} does not match project.version {version} "
                  f"in pyproject.toml (expected tag v{version})."
              )
              sys.exit(1)
          print(f"Tag {tag} matches project.version {version}.")
          EOF

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
